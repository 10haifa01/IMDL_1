slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: localization
    map_start_at_dock: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    resolution: 0.02
    max_laser_range: 12.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    map_update_interval: 5.0
    transform_publish_period: 0.02
    do_loop_closing: false